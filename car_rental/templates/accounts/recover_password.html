<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Recover password | FastCars</title></head>
<body>
  <h1>Recover your password</h1>
  <p>Enter the email and phone number you registered with.</p>
  <form method="post">
    {% csrf_token %}
    {# the "details don't match" error shows here as a non-field error #}
    {{ form.as_p }}
    <button type="submit">Reset password</button>
  </form>
  <a href="{% url 'accounts:login' %}">Back to login</a>
</body>
</html>
